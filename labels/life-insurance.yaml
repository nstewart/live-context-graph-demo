# Life insurance -- an in-force life insurance / annuity servicing vertical.
#
# The carrier administers large books of existing policies, so its business IS
# servicing operations at scale: cases routed to case managers across service
# centers against statutory settlement deadlines. That maps cleanly onto the
# demo's existing shape without changing any of it.
#
# "Acme Life" is a deliberately fictional carrier. Do not commit a real
# customer's name, branding, or assets to this repo -- copy this file locally
# and override `brand` if you need to skin it for a specific account.
#
# This file lists ONLY what differs from freshmart.yaml; everything else is
# inherited. Nothing structural changes: same predicates, same view names, same
# zone CODES, same enum values, same entity counts.
#
#   internal (fixed)  ->  what the customer reads here
#   order             ->  servicing case
#   orderline         ->  case requirement
#   customer          ->  policyholder
#   store             ->  service center
#   product           ->  transaction type
#   inventory         ->  handling capacity
#   courier           ->  case manager
#   task              ->  work item
#   perishable        ->  statutory deadline
#   dynamic pricing   ->  cost to serve  (NEVER benefit amounts -- see below)
#
# DELIBERATE: the demo's "dynamic pricing" maps to cost-to-serve and handling
# priority, never to benefit or settlement amounts. A demo that appears to vary
# what a policyholder is paid by region would be indefensible in front of a
# carrier. "Revenue at Risk" is likewise SLA breach exposure, not benefits.

