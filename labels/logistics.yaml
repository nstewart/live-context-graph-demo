# Logistics -- a regional LTL freight and final-mile carrier vertical.
#
# The carrier moves freight between cross-dock terminals and out to consignees,
# so its business IS operations at scale: shipments booked against dock capacity,
# assigned to drivers, moving across lanes under appointment windows. That maps
# onto the demo's existing shape without changing any of it.
#
# "Meridian Freight" is a deliberately fictional carrier. Do not commit a real
# customer's name, branding, or assets to this repo -- copy this file locally
# and override `brand` if you need to skin it for a specific account.
#
# This file lists ONLY what differs from freshmart.yaml; everything else is
# inherited. Nothing structural changes: same predicates, same view names, same
# zone CODES, same enum values, same entity counts.
#
#   internal (fixed)  ->  what the customer reads here
#   order             ->  shipment
#   orderline         ->  freight line
#   customer          ->  shipper
#   store             ->  terminal
#   product           ->  commodity
#   inventory         ->  dock capacity
#   courier           ->  driver
#   task              ->  dispatch leg
#   zone              ->  lane
#   perishable        ->  temperature-controlled
#   dynamic pricing   ->  live freight rate (linehaul + accessorial)
#
# DELIBERATE: catalog weights stay in the freshmart magnitude (20-1,000) even
# though a real pallet is far heavier. The bundling SQL keys on fixed gram
# thresholds (5kg / 20kg / 50kg in db/materialize/init.sh:1459-1483), so authoring
# realistic pallet weights would push every pair over the limit and the Load
# Consolidation page would go empty. Read the column as billable handling weight
# in carrier units, not grams; the relative ordering is what the demo shows.

