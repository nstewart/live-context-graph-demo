# Portfolio risk -- a buy-side portfolio risk and trade analytics vertical.
#
# A multi-strategy asset manager runs books of positions across asset classes,
# routes trades to execution traders, and watches risk limit utilization in real
# time. That maps onto the demo's existing shape without changing any of it: the
# fulfillment pipeline becomes a trade blotter, capacity becomes risk limits, and
# the dynamic-pricing view becomes a liquidity-adjusted valuation.
#
# "Northwind Capital" is a deliberately fictional manager -- Northwind is the
# canonical sample-database name, which reads as a demo fixture rather than a
# real firm. Do not commit a real client's name, branding, or assets to this
# repo -- copy this file locally and override `brand` to skin it for an account.
#
# This file lists ONLY what differs from freshmart.yaml; everything else is
# inherited. Nothing structural changes: same predicates, same view names, same
# zone CODES, same enum values, same entity counts.
#
#   internal (fixed)  ->  what the customer reads here
#   order             ->  trade
#   orderline         ->  allocation
#   customer          ->  client account
#   store             ->  portfolio
#   product           ->  instrument
#   inventory         ->  position
#   courier           ->  execution trader
#   task              ->  execution step
#   zone              ->  asset class
#   perishable        ->  time-decaying / near expiry
#   dynamic pricing   ->  liquidity-adjusted valuation  (NEVER an official mark)
#
# DELIBERATE: live_price is an INTERNAL risk valuation, never an accounting
# mark, a settlement price, or a client-reportable NAV. A demo that appears to
# publish marks computed from co-movement heuristics would read as mismarking to
# anyone on a valuation-control or audit team. The agent prompt says so
# explicitly, and "Revenue at Risk" is exposure, not P&L.
#
# The zone multipliers are ordered as a liquidity ladder -- the widest
# adjustment lands on the least liquid asset class:
#   MAN +15% Credit | BK +5% Commodities | QNS baseline Equities
#   BX -2% Rates    | SI -5% FX
#
# The vocabulary avoids the word "order" entirely (the leak detector reserves it,
# along with store/product/inventory/customer, as default-vertical vocabulary).
# The entity is a "trade"; the blotter shows trades.

