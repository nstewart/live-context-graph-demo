      - { name: "Rates", perishable_default: false }
      - { name: "Credit", perishable_default: false }
      - { name: "FX", perishable_default: false }
      - { name: "Commodities", perishable_default: false }
      - { name: "Listed Derivatives", perishable_default: true }
