    ACTIVE: Active
  task_status:
    PENDING: Pending
    IN_PROGRESS: Working
    COMPLETED: Settled
    FAILED: Rejected
  vehicle_type:
    # Execution channel, cheapest/most automated first.
    BIKE: Algo
    SCOOTER: DMA
    CAR: High-touch
    WALKING: Manual
  store_status:
    OPEN: Open
    LIMITED: Restricted
  availability_status:
    IN_STOCK: Available
    LOW_STOCK: Thin
