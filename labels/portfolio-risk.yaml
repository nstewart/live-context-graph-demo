seed:
  store_name_template: Northwind {zone_name} Portfolio {n}
  address_state: NY
  locations:
    # Codes are FIXED (the pricing SQL joins on them); names and streets are not.
    # Each desk sits in a financial district appropriate to its asset class.
    - code: BK
      name: Commodities
      streets: [Wacker Dr, LaSalle St, Jackson Blvd, Monroe St, Clark St]
    - code: MAN
      name: Credit
      streets: [Wall St, Broad St, Pine St, Water St, Maiden Ln]
    - code: QNS
      name: Equities
      streets: [Vesey St, Liberty St, Greenwich St, Church St, Murray St]
    - code: BX
      name: Rates
      streets: [Congress St, Federal St, Summer St, High St, Oliver St]
    - code: SI
      name: FX
      streets: [Battery Pl, Front St, Pearl St, Beaver St, Stone St]
