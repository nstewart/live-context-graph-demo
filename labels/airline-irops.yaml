# Airline IROPS -- a Pacific-network passenger carrier vertical.
#
# The carrier sells seats that expire at departure, books guests onto multi-leg
# itineraries, assigns each leg to an aircraft, and re-accommodates guests when
# a station goes constrained. That is operations at scale, and it maps onto the
# demo's existing shape without changing any of it.
#
# "Aurora Pacific" is a deliberately fictional carrier. Do not commit a real
# account's name, branding, or assets to this repo -- copy this file locally
# and override `brand` if you need to skin it for a specific account.
#
# This file lists ONLY what differs from freshmart.yaml; everything else is
# inherited. Nothing structural changes: same predicates, same view names, same
# zone CODES, same enum values, same entity counts.
#
#   internal (fixed)  ->  what the account reads here
#   order             ->  itinerary
#   orderline         ->  segment
#   customer          ->  guest
#   store             ->  station
#   product           ->  fare
#   inventory         ->  seat bucket
#   courier           ->  aircraft (tail)
#   task              ->  flight leg
#   zone              ->  region
#   perishable        ->  day-of-departure
#   dynamic pricing   ->  live fare (revenue management)
#
# DELIBERATE: catalog weights stay in the freshmart magnitude (20-1,000). The
# pairing SQL keys on fixed gram thresholds (5kg / 20kg / 50kg in
# db/materialize/init.sh:1459-1483), so a real seat count or a real agent-minutes
# figure would push every pair over the limit and the Reaccommodation Pairing
# page would go empty. Read the column as re-accommodation effort, not grams;
# the relative ordering is what the demo shows.

