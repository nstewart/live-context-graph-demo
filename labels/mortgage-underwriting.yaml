# Mortgage underwriting -- a residential mortgage origination / underwriting vertical.
#
# The bank originates residential mortgages, so its business IS underwriting
# operations at scale: loan files routed to underwriters across regional
# fulfillment centers, worked against rate-lock and commitment deadlines. That
# maps cleanly onto the demo's existing shape without changing any of it.
#
# "Cornerstone Federal" is a deliberately fictional bank. Do not commit a real
# customer's name, branding, or assets to this repo -- copy this file locally
# and override `brand` if you need to skin it for a specific account.
#
# This file lists ONLY what differs from freshmart.yaml; everything else is
# inherited. Nothing structural changes: same predicates, same view names, same
# zone CODES, same enum values, same entity counts.
#
#   internal (fixed)  ->  what the customer reads here
#   order             ->  loan file
#   orderline         ->  loan condition
#   customer          ->  applicant
#   store             ->  fulfillment center
#   product           ->  loan program
#   inventory         ->  underwriting capacity
#   courier           ->  underwriter
#   task              ->  verification task
#   zone              ->  lending region
#   perishable        ->  rate-locked (has a lock that expires)
#   dynamic pricing   ->  cost to underwrite  (NEVER the borrower's rate)
#
# DELIBERATE, and the single most important note in this file: the demo's
# "dynamic pricing" maps to the bank's INTERNAL cost to underwrite a program at
# a center, never to the borrower's rate, points, or loan-level price
# adjustment. The pricing SQL varies price by region (zone_adjustment: Metro
# East +15%, Pacific West -5%). Presenting that as borrower pricing would be
# showing a fair-lending violation -- geographic price variation is exactly what
# ECOA/Regulation B and redlining enforcement look for -- and a bank's
# compliance team would end the demo on that slide. Cost to underwrite is an
# operational number the bank spends on itself, so region, capacity, and volume
# adjustments are defensible.
#
# For the same reason "Revenue at Risk" is rate-lock expiry exposure -- the
# extension and renegotiation cost the BANK eats when a lock ages out -- not
# borrower revenue.

