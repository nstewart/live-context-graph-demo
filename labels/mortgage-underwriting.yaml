# Reference-architecture diagram. The shape is fixed; these are the upstream
# systems this vertical actually feeds the context layer from.
architecture:
  source_systems:
    heading: Source Systems
    items:
      - Loan Origination
      - Credit Bureau
      - AUS Findings
      - Core Banking

seed:
  store_name_template: Cornerstone Federal {zone_name} Fulfillment Center {n}
  address_state: NC
  locations:
    # Codes are FIXED (the pricing SQL joins on them); names and streets are not.
    - code: BK
      name: Mid-Atlantic
      streets: [S Tryon St, W Trade St, N College St, S Church St, N Brevard St]
    - code: MAN
      name: Metro East
      streets: [Federal St, Congress St, State St, Devonshire St, Summer St]
    - code: QNS
      name: Great Lakes
      streets: [Nicollet Mall, Hennepin Ave, Marquette Ave, Washington Ave, Portland Ave]
    - code: BX
      name: Gulf South
      streets: [Main St, Commerce St, Elm St, Ross Ave, N Akard St]
    - code: SI
      name: Pacific West
      streets: [2nd Ave, Union St, Pike St, Madison St, Marion St]
  catalog:
    # 129 authored loan programs, expanded to the same 760 rows freshmart seeds
    # so index size, kNN behavior, and entity counts are unchanged.
    #
    # `price` is the bank's internal cost to underwrite the program, in dollars
    # -- NOT the borrower's rate or points. See the header note.
    #
    # `weight_grams` is relative review effort, held to freshmart's magnitude
    # (90-600, median ~540 after variant expansion) on purpose. The bundling SQL
    # compares the SUM over a pair of files against fixed gram thresholds
    # (db/materialize/init.sh:1459-1483), and the binding one is 20kg: the
    # courier EXISTS clause only clears a pair via CAR (<=20kg) or BIKE (<=5kg),
    # and no VAN is ever seeded. A file averages 3.5 lines x qty 2.5, so an item
    # median of ~540 puts a pair near 9.5kg -- inside CAR, with the lighter tail
    # inside BIKE. Authoring effort in real underwriter-hours would push every
    # pair past 20kg and the File Batching page would render empty. Read the
    # column as relative effort, not grams; the ordering is what the demo shows.
    #
    # `perishable` is "the file carries a rate lock that expires", which is what
    # makes the work time-critical and earns the same handling priority the
    # pricing SQL gives cold-chain work.
    expand_to: 760
    variant_suffixes:
      - "(high balance)"
      - "(manual underwrite)"
      - "(non-delegated)"
      - "(streamlined docs)"
      - "(exception approved)"
      - "(second review)"
    categories:
      - { name: "Conventional Conforming", perishable_default: true }
      - { name: "Jumbo & Super Jumbo", perishable_default: true }
      - { name: "Government", perishable_default: true }
