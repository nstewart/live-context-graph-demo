# FreshMart -- the default label and the complete reference for every other label.
#
# Other labels specify ONLY the keys they change and inherit the rest (dicts
# merge recursively; lists are replaced wholesale). Because this file is the
# base, it must stay exhaustive: a key that exists nowhere here cannot be
# overridden anywhere else.
#
# What a label may NOT change -- these are data-model shape, and the demo must
# behave identically for whoever is driving it:
#   * predicate names, view names, subject prefixes ("order:", "store:")
#   * enum VALUES (CREATED, MAN, BIKE ...) -- only their display labels
#   * JSON field names on the wire, SQL, and entity counts
# See docs/WHITE_LABELING.md.

label: freshmart

brand:
  name: FreshMart
  tagline: Digital Twin Admin
  tab_title: FreshMart Digital Twin - Admin
  # Tailwind color scale names. `primary` is the brand color (buttons, active
  # nav, wordmark); `accent` is the semantic/vector-search accent.
  theme:
    primary: green
    accent: purple
  favicon: freshmart.svg
  qr:
    url: https://materialize.com/demo/
    cta: Schedule a demo

# Display words for each entity type. The internal subject prefixes never change.
vocabulary:
  order:
    one: order
    many: orders
    title: Order
    title_many: Orders
    id_prefix: FM-
  orderline:
    one: line item
    many: line items
    title: Line Item
    title_many: Line Items
  customer:
    one: customer
    many: customers
    title: Customer
    title_many: Customers
  store:
    one: store
    many: stores
    title: Store
    title_many: Stores
  product:
    one: product
    many: products
    title: Product
    title_many: Products
  inventory:
    one: inventory item
    many: inventory items
    title: Inventory Item
    title_many: Inventory
  courier:
    one: courier
    many: couriers
    title: Courier
    title_many: Couriers
  task:
    one: delivery task
    many: delivery tasks
    title: Delivery Task
    title_many: Delivery Tasks
  zone:
    one: zone
    many: zones
    title: Zone
    title_many: Zones
  perishable:
    adjective: perishable
    note: requires cold chain
    tooltip: Has perishable items
    cart_note: This order contains perishable items requiring cold chain delivery

# Internal enum value -> display label. VALUES ARE FIXED (the SQL joins on them);
# only the right-hand side is label-driven.
enums:
  order_status:
    CREATED: Created
    PICKING: Picking
    OUT_FOR_DELIVERY: Out for Delivery
    DELIVERED: Delivered
    CANCELLED: Cancelled
  courier_status:
    OFF_SHIFT: Off Shift
    AVAILABLE: Available
    ON_DELIVERY: On Delivery
    ACTIVE: Active
  task_status:
    PENDING: Pending
    IN_PROGRESS: In Progress
    COMPLETED: Completed
    FAILED: Failed
  vehicle_type:
    BIKE: Bike
    SCOOTER: Scooter
    CAR: Car
    WALKING: Walking
  store_status:
    OPEN: Open
    LIMITED: Limited
  availability_status:
    IN_STOCK: In Stock
    LOW_STOCK: Low Stock
    OUT_OF_STOCK: Out of Stock
  capacity_health:
    CRITICAL: Critical
    STRAINED: Strained
    HEALTHY: Healthy
    UNDERUTILIZED: Underutilized
  recommended_action:
    CLOSE_INTAKE: Close Intake
    SURGE_PRICING: Surge Pricing
    PROMOTE_DEMAND: Promote Demand
    MONITOR: Monitor
  zone:
    MAN: Manhattan
    BK: Brooklyn
    QNS: Queens
    BX: Bronx
    SI: Staten Island

# DISPLAY-ONLY aliases. Applied at render time in the panels that surface raw
# identifiers (the SQL preview, lineage graph, predicate dropdown, Context &
# Lineage JSON, OpenSearch examples). The wire format, SQL, and database are
# never affected. For freshmart these are identity mappings.
aliases:
  columns: {}
  views: {}
  predicates: {}

# Sidebar navigation. Icons stay in code, keyed by path.
nav:
  - path: /
    label: Agent Ref. Architecture
  - path: /vector-search
    label: Freshmart Agent Search Demo
  - path: /orders
    label: Orders
  - path: /couriers
    label: Couriers
  - path: /metrics
    label: Live Metrics
  - path: /stores
    label: Stores & Inventory
  - path: /ontology
    label: Knowledge Graph (Ontology)
  - path: /triples
    label: Triples Browser
  - path: /bundling
    label: Delivery Bundling
  - path: /settings
    label: Settings

pages:
  home:
    title: "Freshmart: Live Context Layer + Agent Memory Demo"
  vector_search:
    title: Freshmart Agent Search Demo
  orders:
    title: Orders Dashboard
    subtitle: Monitor and manage FreshMart orders via WebSocket
    search_placeholder: Search order #...
  couriers:
    title: Couriers & Schedule
    subtitle: View courier status and assigned tasks
    search_placeholder: Search by courier ID...
  stores:
    title: Stores & Inventory
    inventory_title: Inventory
    all_inventory_title: All Inventory Items
  metrics:
    title: Live Metrics Dashboard
    subtitle: Real-time business health indicators
    kpi_pricing_yield: Dynamic Pricing Yield
    kpi_revenue_at_risk: Revenue at Risk
    kpi_store_utilization: Avg Store Utilization
    chart_demand_vs_capacity: Store Demand vs Capacity
    section_risk_title: High-Risk Inventory
    section_risk_subtitle: >-
      Products with low stock levels that have pending customer orders (may
      cause stockouts)
    section_capacity_title: Store Capacity Status
    section_capacity_subtitle: >-
      Real-time store workload with automated recommendations for demand
      management
  bundling:
    title: Delivery Bundling
    subtitle: Mutually recursive constraint satisfaction
    constraint_time_note: Delivery windows intersect
    constraint_inventory_note: Stock available for combined qty
    constraint_capacity_note: Weight fits courier vehicle
    empty: >-
      No bundles yet. Create orders with overlapping delivery windows to see
      bundles form.
  # Load-generator lifecycle stages. The stage NAMES are fixed in the
  # generator; these are only what the operator reads next to each duration.
  settings:
    stage_dispatch: Dispatch
    stage_picking: Picking
    stage_delivery: Delivery
    stage_help_dispatch: How often to check for pending orders.
    stage_help_picking: Time to pick items.
    stage_help_delivery: Time to deliver.

copy:
  triples:
    heading: Agent Writes and Memories
    subhead: >-
      Using "triples" as the atomic unit of knowledge recorded by agents. This
      forms the foundation that will ultimately create their world model.
    # Rendered around the styled "Subject → Predicate → Value" chips, which are
    # RDF terms and stay fixed.
    explainer_lead: >-
      Triples are the atomic unit of knowledge—each captures a single fact as
    explainer_tail: >-
      This structure lets AI agents update individual facts without needing
      complex schemas or full object structures.
    selector_label: Select Order
    table_heading: Triples for Order
    empty: No triples found for this order
    closing: >-
      Click any row to pre-populate the Write Triple form below. This view shows
      only triples for the selected order and its line items—the full graph
      includes customers, stores, products, inventory, couriers, and delivery
      tasks.
  knowledge_graph:
    heading: Leveraging Context Graphs
    subhead: >-
      The relationships that give agents and humans understanding about what to
      do next and why
    entity_examples: Order, Customer, Product
  write_triple:
    heading: Write a Triple
    subhead: — Update an order property and observe propagation
  vector_pipeline:
    heading: Vector Pipeline
    subhead: Semantic search + live data hydration from Materialize
    explainer: >-
      The vector store finds which documents match semantically. Materialize
      provides live data for those documents — always fresh, never stale.
    search_heading: Hybrid Search
    all_zones: All zones
    all_statuses: All statuses
  cart:
    heading: Shopping Cart
    empty_heading: Your cart is empty
  # The three prices the demo compares. A label that must not imply variable
  # customer pricing (see life-insurance.yaml) reinterprets these as cost.
  pricing:
    order_price_label: Order Price
    order_price_tooltip: >-
      Price locked in when the order was placed - what the customer was
      charged for this item
    base_price_label: Base Price
    base_price_tooltip: >-
      Product's current static catalog price - no dynamic adjustments applied
    live_price_label: Live Price
    live_price_tooltip: >-
      Current dynamically-calculated price based on demand, stock levels, and
      other factors
    # Short forms for the three narrow price columns; the full label
    # above stays in each column's tooltip.
    order_price_short: Order
    base_price_short: Base
    live_price_short: Live
  rerank:
    # The fields the cross-encoder reads live from Materialize.
    hydrated_fields: status, items, current price and stock

placeholders:
  subject: order:FM-1001
  order_number: FM-1001
  store_name: FreshMart Brooklyn
  store_code: BK-01
  store_zone: BK
  store_address: 123 Main St, Brooklyn, NY
  inventory_code: INV-BK01-001
  courier_code: CR-01
  courier_name: John Smith
  product_search: Search products...
  order_search: Search orders...
  semantic_search: Search by meaning (e.g., dairy products)...

examples:
  search_queries:
    - organic produce
    - dairy products
    - perishable delivery
  # Keyword (not semantic) examples. These execute a literal multi_match against
  # the orders index, so every value must actually occur in seeded data: a
  # location name, a zone code, or a status the generator really produces
  # (CREATED / DELIVERED / CANCELLED -- NOT PICKING or OUT_FOR_DELIVERY, which
  # the seeder never emits). Verify with:
  #   curl -s localhost:9200/orders/_count -H 'Content-Type: application/json' \
  #     -d '{"query":{"multi_match":{"query":"<value>","fields":["store_name","store_zone","order_status"]}}}'
  keyword_queries:
    - Brooklyn
    - Manhattan
    - CREATED
    - BK
  # Sample values for the "Write a Triple" form, keyed by predicate. Predicate
  # names themselves are fixed by the ontology.
  predicate_values:
    order_status: DELIVERED
    order_number: FM-1234
    delivery_window_start: "2025-01-15T10:00:00"
    delivery_window_end: "2025-01-15T12:00:00"
    quantity: "5"
    order_line_unit_price: "12.99"
    line_sequence: "1"
    customer_name: John Doe
    customer_email: john@example.com
    customer_address: 123 Main St
    store_name: Downtown Market
    store_zone: MAN
    store_address: 456 Broadway
    product_name: Organic Apples
    category: Produce
    unit_price: "4.99"
    perishable: "true"
    unit_weight_grams: "500"
    stock_level: "100"
    replenishment_eta: "2025-01-16T08:00:00"
    courier_name: Jane Smith
    courier_phone: 555-1234
    courier_status: ACTIVE
    task_status: COMPLETED
    assigned_to: courier:C-001
    eta: "2025-01-15T11:00:00"


# Reference-architecture diagram. The shape is fixed; these are the upstream
# systems this vertical actually feeds the context layer from.
architecture:
  source_systems:
    heading: Source Systems
    items:
      - CRM
      - ERP
      - Apps
      - External Data

seed:
  # {zone_name} and {n} are substituted per store.
  store_name_template: FreshMart {zone_name} {n}
  locations:
    - code: BK
      name: Brooklyn
      streets: [Atlantic Ave, Court St, Flatbush Ave, Smith St, Bedford Ave]
    - code: MAN
      name: Manhattan
      streets: [Broadway, 5th Ave, Madison Ave, Park Ave, Lexington Ave]
    - code: QNS
      name: Queens
      streets: [Steinway St, Queens Blvd, Jamaica Ave, Roosevelt Ave, Northern Blvd]
    - code: BX
      name: Bronx
      streets: [Grand Concourse, Fordham Rd, E Tremont Ave, Webster Ave, 3rd Ave]
    - code: SI
      name: Staten Island
